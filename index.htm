<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Trifiletti - Resume</title>
    
    <script src="https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #webgl-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-family: sans-serif;
            pointer-events: none;
            text-align: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 24px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="webgl-container"></div>
    <div id="loading">Decoding TIF Texture...</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const TIF_FILE_PATH = 'eso0932a.tif';
        const apiEndpoint = 'https://xwwvxanzrh.execute-api.us-east-2.amazonaws.com/count';

        const container = document.getElementById('webgl-container');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        camera.position.set(0, 0.1, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.0)); 
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = false;
        controls.minDistance = 1.01; 
        controls.maxDistance = 20;

        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float iTime;
            uniform vec2 iResolution;
            uniform sampler2D iChannel0;
            uniform vec3 iCameraPos;
            uniform vec3 iCameraDir;
            uniform vec3 iCameraUp;
            uniform vec3 iCameraRight;
            
            uniform float uGravity;
            uniform float uAccelScale;
            uniform float uStepSize;
            uniform float uDiscRadiusMin;
            uniform float uDiscRadiusMax;
            uniform float uDiscThickness;
            uniform float uDiscIntensity;
            uniform float uOrbitalSpeed;
            uniform float uNoiseScale;
            uniform float uDopplerStrength;

            varying vec2 vUv;

            #define MAX_STEPS 45
            #define MAX_DIST 30.0
            #define PI 3.14159265

            float hash(vec2 p) {
                p = 50.0 * fract(p * 0.3183099 + vec2(0.71, 0.113));
                return -1.0 + 2.0 * fract(p.x * p.y * (p.x + p.y));
            }

            float noise(vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);
                vec2 u = f * f * (3.0 - 2.0 * f);
                return mix(mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
                           mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
            }

            float fbm(vec2 p) {
                float f = 0.0;
                float m = 0.5;
                for (int i = 0; i < 3; i++) {
                    f += m * noise(p);
                    p *= 2.0;
                    m *= 0.5;
                }
                return f;
            }

            vec3 getBackground(vec3 dir) {
                vec2 uv = vec2(0.5 + atan(dir.z, dir.x) / (2.0 * PI), 0.5 - asin(dir.y) / PI);
                return texture2D(iChannel0, uv).rgb;
            }

            void main() {
                vec2 uv = vUv * 2.0 - 1.0;
                uv.x *= iResolution.x / iResolution.y;

                vec3 ro = iCameraPos;
                vec3 rd = normalize(iCameraDir + uv.x * iCameraRight + uv.y * iCameraUp);

                vec3 col = vec3(0.0);
                vec3 p = ro;
                vec3 dir = rd;
                
                vec3 accumulatedGlow = vec3(0.0);
                bool hitBlackHole = false;
                
                for(int i = 0; i < MAX_STEPS; i++) {
                    float dist = length(p);

                    if(dist < 1.0) {
                        hitBlackHole = true;
                        break;
                    }
                    
                    if(dist > MAX_DIST) {
                        break; 
                    }

                    float force = uGravity / (dist * dist);
                    vec3 accel = -normalize(p) * force;
                    
                    dir = normalize(dir + accel * uAccelScale); 
                    p += dir * uStepSize; 

                    float distToPlane = abs(p.y);
                    float radius = length(p.xz);
                    
                    if(distToPlane < uDiscThickness && radius > uDiscRadiusMin && radius < uDiscRadiusMax) {
                        float angle = atan(p.z, p.x);
                        
                        float orbitalSpeedFactor = uOrbitalSpeed * pow(radius, -1.5); 
                        
                        vec2 uvNoise = vec2(radius * uNoiseScale, angle * 2.0 - iTime * orbitalSpeedFactor);
                        float cloudBase = 0.4 + 0.6 * fbm(uvNoise);
                        
                        float radialFade = smoothstep(uDiscRadiusMin, uDiscRadiusMin + 0.5, radius) * smoothstep(uDiscRadiusMax, uDiscRadiusMax - 1.5, radius);
                        float verticalFade = exp(-distToPlane * 10.0); 

                        float density = cloudBase * radialFade * verticalFade;

                        vec3 gasVelocity = normalize(vec3(-p.z, 0.0, p.x));
                        float dotV = dot(dir, gasVelocity);
                        float doppler = 1.0 - dotV * uDopplerStrength; 
                        float beaming = pow(doppler, 3.0); 

                        float normalizedRadius = (radius - uDiscRadiusMin) / (uDiscRadiusMax - uDiscRadiusMin);
                        vec3 hotColor = vec3(1.0, 0.7, 0.15);   
                        vec3 midColor = vec3(1.0, 0.35, 0.02);  
                        vec3 coldColor = vec3(0.5, 0.05, 0.0);  
                        
                        vec3 localColor = mix(hotColor, midColor, smoothstep(0.0, 0.4, normalizedRadius));
                        localColor = mix(localColor, coldColor, smoothstep(0.4, 1.0, normalizedRadius));
                        
                        accumulatedGlow += localColor * density * beaming * uDiscIntensity * 0.015;
                    }
                }

                if (!hitBlackHole) {
                    col = getBackground(dir);
                } else {
                    col = vec3(0.0);
                }

                col += accumulatedGlow;
                col = vec3(1.0) - exp(-col * 1.5);

                gl_FragColor = vec4(col, 1.0);
            }
        `;

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            for(let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = context.measureText(testLine);
                const testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, y);
            return y + lineHeight;
        }

        const textCanvas = document.createElement('canvas');
        textCanvas.width = 1024;
        textCanvas.height = 1400;
        const textCtx = textCanvas.getContext('2d');
        const resumeTexture = new THREE.CanvasTexture(textCanvas);
        
        function drawResume(visitorCount = "Loading...") {
            textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);
            
            textCtx.fillStyle = 'rgba(0, 0, 0, 0)'; 
            textCtx.fillRect(0, 0, textCanvas.width, textCanvas.height);

            textCtx.fillStyle = '#63b3ed'; 
            textCtx.font = 'bold 54px sans-serif';
            textCtx.fillText('ALEX TRIFILETTI', 40, 80);
            
            textCtx.fillStyle = '#cbd5e0';
            textCtx.font = '24px sans-serif';
            textCtx.fillText('Nazareth, Pennsylvania • 570-497-7892 • alextrif@icloud.com', 40, 120);

            textCtx.fillStyle = '#63b3ed';
            textCtx.font = 'bold 28px sans-serif';
            textCtx.fillText('OVERVIEW & OBJECTIVE', 40, 200);
            textCtx.fillStyle = '#e2e8f0';
            textCtx.font = '22px sans-serif';
            wrapText(textCtx, "Motivated and eager to learn with a strong foundation in orderly time management and prioritization. High interest in pursuing Cybersecurity with a proven track record of academic excellence and consistency. To apply my experience in teamwork, technical troubleshooting, and project management to a challenging role while pursuing my degree at The Pennsylvania State University.", 40, 240, 940, 32);

            textCtx.fillStyle = '#63b3ed';
            textCtx.font = 'bold 28px sans-serif';
            textCtx.fillText('EDUCATION', 40, 420);
            textCtx.fillStyle = '#f7fafc';
            textCtx.font = 'bold 24px sans-serif';
            textCtx.fillText('The Pennsylvania State University, State College, Pennsylvania', 40, 460);
            textCtx.font = 'italic 22px sans-serif';
            textCtx.fillStyle = '#cbd5e0';
            textCtx.fillText('College of Information Sciences and Technology; B.S. Cybersecurity', 40, 495);
            textCtx.fillStyle = '#e2e8f0';
            textCtx.font = '22px sans-serif';
            textCtx.fillText('• GPA: 3.92', 60, 530);
            textCtx.fillText("• Dean's List Fall '25 and Spring '26", 60, 565);
            
            textCtx.fillStyle = '#f7fafc';
            textCtx.font = 'bold 24px sans-serif';
            textCtx.fillText('Nazareth Area High School, Nazareth, Pennsylvania', 40, 620);
            textCtx.fillStyle = '#e2e8f0';
            textCtx.font = '22px sans-serif';
            textCtx.fillText('• High School Grade Point Average: 4.00 (95%)', 60, 655);
            textCtx.fillText('• Honors: High Honor Roll Graduate', 60, 690);

            textCtx.fillStyle = '#63b3ed';
            textCtx.font = 'bold 28px sans-serif';
            textCtx.fillText('EXPERIENCE', 40, 770);
            textCtx.fillStyle = '#f7fafc';
            textCtx.font = 'bold 24px sans-serif';
            textCtx.fillText('K & J Party Rentals — Delivery & Setup Crew (Seasonal)', 40, 810);
            textCtx.fillStyle = '#e2e8f0';
            textCtx.font = '22px sans-serif';
            textCtx.fillText('• Worked in a three-person team setting up tents, tables, and bounce houses.', 60, 845);
            textCtx.fillText('• Developed attention to detail and experience with equipment assembly.', 60, 880);
            textCtx.fillText('• Maintained a position requiring teamwork and physical demand.', 60, 915);

            textCtx.fillStyle = '#63b3ed';
            textCtx.font = 'bold 28px sans-serif';
            textCtx.fillText('ACTIVITIES', 40, 995);
            textCtx.fillStyle = '#e2e8f0';
            textCtx.font = '22px sans-serif';
            textCtx.fillText('• 3D Printing: Experience with filament/resin printers and slicing software.', 40, 1035);
            textCtx.fillText('• Weight Lifting: Dedicated to extensive research and consistency for results.', 40, 1070);
            textCtx.fillText('• League Sim Racing: Experience in competitive environments.', 40, 1105);

            textCtx.fillStyle = '#63b3ed';
            textCtx.font = 'bold 28px sans-serif';
            textCtx.fillText('SKILLS', 40, 1185);
            textCtx.fillStyle = '#e2e8f0';
            textCtx.font = '22px sans-serif';
            textCtx.fillText('• Communication: Convey information in a clear and concise way.', 40, 1225);
            textCtx.fillText('• Technical: Competent with technology and PC troubleshooting.', 40, 1260);
            textCtx.fillText('• Software/Platforms: Cisco Packet Tracer, Wireshark, VMware Fusion.', 40, 1295);

            textCtx.fillStyle = '#63b3ed';
            textCtx.font = 'bold 24px sans-serif';
            textCtx.fillText(`Page views: ${visitorCount}`, 40, 1370);

            resumeTexture.needsUpdate = true;
        }

        drawResume();

        async function fetchVisitorCount() {
            try {
                let response = await fetch(apiEndpoint);
                let data = await response.json();
                drawResume(data.count); 
            } catch (error) {
                console.error('Error fetching visitor count:', error);
                drawResume("Error loading count");
            }
        }
        fetchVisitorCount();

        const resumeMaterial = new THREE.MeshBasicMaterial({ 
            map: resumeTexture, 
            transparent: true,
            opacity: 1.0,
            depthWrite: false 
        });
        
        const resumeMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.06, 1.45), resumeMaterial);
        resumeMesh.position.set(0.06, 0, 2); 
        resumeMesh.rotation.set(0, 0, 0); 
        scene.add(resumeMesh);

        fetch(TIF_FILE_PATH)
            .then(response => {
                if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
                return response.arrayBuffer();
            })
            .then(buffer => {
                const ifds = UTIF.decode(buffer);
                UTIF.decodeImage(buffer, ifds[0]);
                const rgba = UTIF.toRGBA8(ifds[0]);
                const texture = new THREE.DataTexture(rgba, ifds[0].width, ifds[0].height, THREE.RGBAFormat);
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.ClampToEdgeWrapping;
                texture.minFilter = THREE.LinearFilter;
                texture.magFilter = THREE.LinearFilter;
                texture.needsUpdate = true;
                document.getElementById('loading').style.display = 'none';
                initSim(texture);
            })
            .catch(err => {
                document.getElementById('loading').innerText = "TIF Error. Generating Starfield...";
                const canvas = document.createElement('canvas');
                canvas.width = 1024; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, 1024, 512);
                ctx.fillStyle = '#FFFFFF';
                for(let i = 0; i < 600; i++) {
                    ctx.beginPath();
                    ctx.arc(Math.random() * 1024, Math.random() * 512, Math.random() * 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                const dummyTex = new THREE.CanvasTexture(canvas);
                dummyTex.wrapS = THREE.RepeatWrapping;
                dummyTex.wrapT = THREE.ClampToEdgeWrapping;
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                    initSim(dummyTex);
                }, 500);
            });

        function initSim(bgTexture) {
            const geometry = new THREE.PlaneGeometry(2, 2);

            const uniforms = {
                iTime: { value: 0 },
                iResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                iChannel0: { value: bgTexture },
                iCameraPos: { value: new THREE.Vector3() },
                iCameraDir: { value: new THREE.Vector3() },
                iCameraUp: { value: new THREE.Vector3() },
                iCameraRight: { value: new THREE.Vector3() },
                uGravity: { value: 3.0 },
                uAccelScale: { value: 0.2 },
                uStepSize: { value: 0.4 },
                uDiscRadiusMin: { value: 2.4 },
                uDiscRadiusMax: { value: 9.0 },
                uDiscThickness: { value: 0.25 },
                uDiscIntensity: { value: 8.0 },
                uOrbitalSpeed: { value: 1.8 },
                uNoiseScale: { value: 2.5 },
                uDopplerStrength: { value: 0.18 }
            };

            const shaderMaterial = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                uniforms: uniforms,
                depthWrite: false,
                depthTest: false
            });

            const bgMesh = new THREE.Mesh(geometry, shaderMaterial);
            bgMesh.renderOrder = -1; 
            scene.add(bgMesh);

            const clock = new THREE.Clock();
            const cameraDir = new THREE.Vector3();
            const cameraUp = new THREE.Vector3();
            const cameraRight = new THREE.Vector3();

            const eventHorizon = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 1.35); 
            const ray = new THREE.Ray();
            const intersectionPoint = new THREE.Vector3();

            function animate() {
                requestAnimationFrame(animate);
                controls.update();

                uniforms.iTime.value = clock.getElapsedTime();
                uniforms.iCameraPos.value.copy(camera.position);

                camera.getWorldDirection(cameraDir);
                cameraDir.normalize();
                cameraRight.crossVectors(cameraDir, camera.up).normalize();
                cameraUp.crossVectors(cameraRight, cameraDir).normalize();

                uniforms.iCameraDir.value.copy(cameraDir);
                uniforms.iCameraUp.value.copy(cameraUp);
                uniforms.iCameraRight.value.copy(cameraRight);

                ray.origin.copy(camera.position);
                ray.direction.copy(resumeMesh.position).sub(camera.position).normalize();

                const isIntersecting = ray.intersectSphere(eventHorizon, intersectionPoint);
                const distToText = camera.position.distanceTo(resumeMesh.position);

                if (isIntersecting && camera.position.distanceTo(intersectionPoint) < distToText) {
                    resumeMesh.material.opacity = THREE.MathUtils.lerp(resumeMesh.material.opacity, 0.0, 0.15);
                } else {
                    resumeMesh.material.opacity = THREE.MathUtils.lerp(resumeMesh.material.opacity, 1.0, 0.15);
                }

                renderer.render(scene, camera);
            }
            animate();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            scene.children.forEach(child => {
                if (child.material.uniforms && child.material.uniforms.iResolution) {
                    child.material.uniforms.iResolution.value.set(window.innerWidth, window.innerHeight);
                }
            });
        });
    </script>
</body>
</html>
